<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<title>M0 Spike: PyWorker + rdflib + pyshacl</title>
</head>
<body>
<h1>M0 Spike: PyWorker + rdflib + pyshacl</h1>
<pre id="out">loading...</pre>
<script type="module">
  const out = document.getElementById('out');
  const t0 = performance.now();
  const el = () => ((performance.now() - t0) / 1000).toFixed(1) + 's';
  async function run() {
    try {
      const { PyWorker } = await import('https://pyscript.net/releases/2026.7.3/core.js');
      out.textContent += `[${el()}] PyWorker imported\n`;
      const worker = await PyWorker('./worker_rdf.py', { type: 'pyodide', config: './pyscript.toml' });
      out.textContent += `[${el()}] worker ready\n`;

      const pingResult = await worker.sync.ping();
      out.textContent += `[${el()}] ping -> ${JSON.stringify(pingResult)}\n`;

      const rdflibResult = await worker.sync.rdflib_check();
      out.textContent += `[${el()}] rdflib_check -> ${JSON.stringify(rdflibResult)}\n`;

      const pyshaclResult = await worker.sync.pyshacl_check();
      out.textContent += `[${el()}] pyshacl_check -> ${JSON.stringify(pyshaclResult)}\n`;

      out.textContent += `\nSPIKE RESULT: SUCCESS\n`;
    } catch (err) {
      out.textContent += `\n[${el()}] SPIKE RESULT: FAILURE\n${err}\n${err.stack || ''}`;
      console.error(err);
    }
  }
  run();
</script>
</body>
</html>
